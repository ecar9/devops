services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.cof:/etc/nginx/conf.d/defualt.conf:ro
    depends_on:
      web:
        condition: service_healthy
  web:
    build: .
    expose:
      - "5000"
    environment:
      APP_TITLE: "방명록"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?비밀번호 설정 필요}" # web의 environment
    depends_on:
      - redis
    restart: unless-stopped #예상치 않게 종료 시 자동 재시작
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
